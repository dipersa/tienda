{% extends 'productos/base.html' %}

{% block title %}Pedido Confirmado{% endblock %}

{% block content %}
<section class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 100%;">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">¡Gracias por tu compra!</h5>
        </div>
        <div class="card-body">
            <p class="text-muted mb-3">Tu pedido ha sido registrado con éxito.</p>
            <p class="mb-4"><strong>Número de Pedido:</strong> {{ pedido.id }}</p>
            <p class="mb-4"><strong>Total:</strong> <span class="text-success fw-bold">${{ pedido.total }}</span></p>
            <a href="{% url 'dashboard' %}" class="btn btn-primary w-100">
                <i class="fas fa-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </div>
</section>
{% endblock %}
