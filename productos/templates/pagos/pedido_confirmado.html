<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <!-- Contenedor Principal -->
    <div class="bg-white shadow-md rounded-lg p-8 w-96 text-center">
        <h2 class="text-2xl font-bold text-green-500 mb-6">¡Gracias por tu compra!</h2>
        <p class="text-gray-700 mb-4">Tu pedido ha sido registrado con éxito.</p>
        <p class="text-gray-700 mb-4"><strong>Número de Pedido:</strong> {{ pedido.id }}</p>
        <p class="text-gray-700 mb-6"><strong>Total:</strong> <span class="text-green-500 font-bold">${{ pedido.total }}</span></p>
        <a href="{% url 'dashboard' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Volver al Dashboard</a>
    </div>
</body>
</html>
