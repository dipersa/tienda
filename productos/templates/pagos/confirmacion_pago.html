{% extends 'productos/base.html' %}

{% block title %}Confirmación de Pago{% endblock %}

{% block content %}
<section class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Confirmación de Pago</h5>
        </div>
        <div class="card-body text-center">
            <p class="text-muted mb-4">Total a Pagar:</p>
            <h3 class="text-success fw-bold mb-4">${{ total }}</h3>
            <button id="pagar" class="btn btn-primary w-100 py-2">
                <i class="fas fa-credit-card"></i> Pagar Ahora
            </button>

            <script src="https://js.stripe.com/v3/"></script>
            <script>
                const stripe = Stripe('{{ stripe_publishable_key }}');
                const clientSecret = "{{ client_secret }}";

                document.getElementById('pagar').addEventListener('click', () => {
                    stripe.confirmCardPayment(clientSecret, {
                        payment_method: {
                            card: {
                                // Aquí puedes integrar un elemento de Stripe.js para recoger los datos de la tarjeta
                            },
                        },
                    }).then((result) => {
                        if (result.error) {
                            alert("Error en el pago: " + result.error.message);
                        } else {
                            alert("Pago exitoso!");
                            window.location.href = "/carrito/";  // Redirige al carrito o página de confirmación
                        }
                    });
                });
            </script>
        </div>
    </div>
</section>
{% endblock %}
