<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <!-- Contenedor Principal -->
    <div class="bg-white shadow-md rounded-lg p-8 w-96 text-center">
        <h2 class="text-2xl font-bold text-blue-500 mb-6">Confirmación de Pago</h2>
        <p class="text-gray-700 mb-6">Total a Pagar: <span class="text-green-500 font-bold">${{ total }}</span></p>
        <button id="pagar" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Pagar Ahora</button>

        <script>
            const stripe = Stripe('{{ stripe_publishable_key }}');
            const clientSecret = "{{ client_secret }}";

            document.getElementById('pagar').addEventListener('click', () => {
                stripe.confirmCardPayment(clientSecret, {
                    payment_method: {
                        card: {
                            // Aquí puedes integrar un elemento de Stripe.js para recoger los datos de la tarjeta
                        },
                    },
                }).then((result) => {
                    if (result.error) {
                        alert("Error en el pago: " + result.error.message);
                    } else {
                        alert("Pago exitoso!");
                        window.location.href = "/carrito/";  // Redirige al carrito o página de confirmación
                    }
                });
            });
        </script>
    </div>
</body>
</html>
