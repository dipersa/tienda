<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <!-- Contenedor Principal -->
    <div class="bg-white shadow-md rounded-lg p-8 w-96 text-center">
        <h2 class="text-2xl font-bold text-blue-500 mb-6">Procesar Pago</h2>
        <p class="text-gray-700 mb-6">Total a Pagar: <span class="text-green-500 font-bold">${{ total }}</span></p>
        <form action="{% url 'procesar_pago' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Proceder al Pago</button>
        </form>
    </div>
</body>
</html>
