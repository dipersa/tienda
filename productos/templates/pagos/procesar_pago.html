{% extends 'productos/base.html' %}

{% block title %}Procesar Pago{% endblock %}

{% block content %}
<section class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Procesar Pago</h5>
        </div>
        <div class="card-body text-center">
            <p class="text-muted mb-4">Total a Pagar:</p>
            <h3 class="text-success fw-bold mb-4">${{ total }}</h3>
            <form action="{% url 'procesar_pago' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fas fa-credit-card"></i> Proceder al Pago
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
