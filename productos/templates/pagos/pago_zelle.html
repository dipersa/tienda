<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago con Zelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <!-- Contenedor Principal -->
    <div class="bg-white shadow-md rounded-lg p-8 w-96 text-center">
        <h2 class="text-2xl font-bold text-blue-500 mb-6">Pago con Zelle</h2>
        <p class="text-gray-700 mb-4">Total a Pagar: <span class="text-green-500 font-bold">${{ total }}</span></p>
        <p class="text-gray-700 mb-4">Por favor, realiza la transferencia a:</p>
        <ul class="text-left text-gray-700 mb-6">
            <li><strong>Celular:</strong> +1-786-741-7011</li>
            <li><strong>Nombre:</strong> Tienda Online</li>
        </ul>
        <p class="text-gray-700 mb-6">Después de realizar el pago, envíanos un comprobante al WhatsApp.</p>
        <a href="{% url 'ver_carrito' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Volver al Carrito</a>
    </div>
</body>
</html>
