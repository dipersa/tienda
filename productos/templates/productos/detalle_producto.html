{% extends 'productos/base.html' %}

{% block title %}{{ producto.nombre }}{% endblock %}

{% block content %}
<section class="container mx-auto px-5 py-10">
    <div class="flex flex-col md:flex-row items-start bg-white shadow-lg rounded-lg overflow-hidden">
        <!-- Imagen del Producto -->
        <div class="w-full md:w-1/2">
            <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="w-full h-full object-contain bg-gray-100 p-5">
        </div>
        <!-- Detalles del Producto -->
        <div class="w-full md:w-1/2 p-5">
            <h1 class="text-3xl font-bold text-gray-800">{{ producto.nombre }}</h1>
            <p class="text-gray-600 mt-3">{{ producto.descripcion }}</p>
            <p class="text-green-500 text-2xl font-bold mt-3">${{ producto.precio }}</p>
            <p class="text-gray-700 mt-1">Stock disponible: {{ producto.stock }}</p>

            <!-- Agregar al Carrito -->
            <form action="{% url 'agregar_al_carrito' producto.id %}" method="post" class="mt-5">
                {% csrf_token %}
                <label for="cantidad" class="block text-gray-600 mb-2">Cantidad:</label>
                <input type="number" name="cantidad" value="1" min="1" id="cantidad" class="border rounded w-16 p-2 text-center">
                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition mt-3">Agregar al Carrito</button>
            </form>

            <!-- Botón de Regresar -->
            <a href="{% url 'tienda' %}" class="block mt-5 text-blue-500 hover:underline">← Volver a la Tienda</a>
        </div>
    </div>
</section>
{% endblock %}
