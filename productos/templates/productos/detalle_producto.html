<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ producto.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="container mx-auto p-5">
    <div class="bg-white p-5 shadow rounded-lg">
        {% if producto.imagen %}
            <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}"
                 class="w-full h-64 object-cover rounded-md">
        {% endif %}
        <h2 class="text-3xl font-bold mt-3">{{ producto.nombre }}</h2>
        <p class="text-gray-500 mt-2">{{ producto.descripcion }}</p>
        <p class="text-green-500 font-bold text-2xl mt-3">${{ producto.precio }}</p>
        <p class="text-gray-700 mt-1">Stock disponible: {{ producto.stock }}</p>

        <!-- Botones -->
        <a href="{% url 'agregar_al_carrito' producto.id %}"
           class="mt-5 inline-block bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Agregar al Carrito</a>
        <a href="{% url 'tienda' %}"
           class="mt-5 inline-block bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Volver</a>
    </div>
</div>
</body>
</html>
