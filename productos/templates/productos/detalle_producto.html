{% extends 'productos/base.html' %}

{% block title %}{{ producto.nombre }}{% endblock %}

{% block content %}
<section class="container mt-5">
    <div class="card shadow-lg">
        <div class="row g-0">
            <!-- Imagen del Producto -->
            <div class="col-md-6">
                <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="img-fluid rounded-start">
            </div>
            <!-- Detalles del Producto -->
            <div class="col-md-6 d-flex flex-column justify-content-center p-4">
                <h1 class="card-title text-primary">{{ producto.nombre }}</h1>
                <p class="card-text">{{ producto.descripcion }}</p>
                <h4 class="text-success fw-bold">${{ producto.precio }}</h4>
                <p class="text-muted">Stock disponible: {{ producto.stock }}</p>

                <!-- Agregar al Carrito -->
                <form action="{% url 'agregar_al_carrito' producto.id %}" method="post" class="mt-3">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad:</label>
                        <input type="number" name="cantidad" value="1" min="1" id="cantidad" class="form-control w-25">
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-cart-plus"></i> Agregar al Carrito
                    </button>
                </form>

                <!-- Botón de Regresar -->
                <a href="{% url 'tienda' %}" class="btn btn-link mt-3">
                    <i class="fas fa-arrow-left"></i> Volver a la Tienda
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
