<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda Online{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Barra de Navegación -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-5 py-4 flex justify-between items-center">
            <a href="{% url 'tienda' %}" class="text-2xl font-bold text-blue-500">Tienda Online VERSAVILA</a>
            <div class="flex items-center space-x-4">
                <a href="{% url 'tienda' %}" class="text-gray-600 hover:text-blue-500">Tienda</a>
                <a href="{% url 'agregar_contacto' %}" class="text-gray-600 hover:text-blue-500">Contactos</a>
                <a href="{% url 'ver_carrito' %}" class="text-gray-600 hover:text-blue-500 justify-center">Carrito ({{ request.session.carrito|length }})</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="text-gray-600 hover:text-blue-500">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-gray-600 hover:text-blue-500">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <main class="container mx-auto px-5 mt-10">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-5 mt-10">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 Tienda Online. Todos los derechos reservados.</p>
            <p class="mt-2">Contacto: soporte@tiendaonline.com</p>
        </div>
    </footer>
</body>
</html>
