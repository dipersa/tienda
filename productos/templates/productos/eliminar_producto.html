{% extends 'productos/base.html' %}

{% block title %}Eliminar Producto{% endblock %}

{% block content %}
<section class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 500px;">
        <div class="card-header bg-danger text-white text-center">
            <h5 class="mb-0">Eliminar Producto</h5>
        </div>
        <div class="card-body text-center">
            <p class="mb-4">¿Estás seguro que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash-alt"></i> Eliminar
                </button>
                <a href="{% url 'lista_productos' %}" class="btn btn-secondary ms-2">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
