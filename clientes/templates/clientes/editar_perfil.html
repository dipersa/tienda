<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <!-- Contenedor Principal -->
    <div class="bg-white shadow-md rounded-lg p-8 w-96">
        <h2 class="text-2xl font-bold text-center text-blue-500 mb-6">Editar Perfil</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600">Guardar Cambios</button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'dashboard' %}" class="text-blue-500 hover:underline">Volver al Dashboard</a>
        </div>
    </div>
</body>
</html>
