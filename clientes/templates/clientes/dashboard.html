<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white shadow-md rounded-lg p-8 w-96">
        <h2 class="text-2xl font-bold text-blue-500 mb-6">
            Bienvenido, {{ usuario.nombre }} {{ usuario.apellidos }}
        </h2>
        <p class="text-gray-700 mb-4"><strong>Correo:</strong> {{ usuario.email }}</p>
        <p class="text-gray-700 mb-6"><strong>Celular:</strong> {{ usuario.celular }}</p>

        <div class="space-y-4">
            <a href="{% url 'tienda' %}" class="w-full bg-blue-500 text-white py-2 rounded block text-center hover:bg-blue-600">
                Ir a la Tienda
            </a>
            <a href="{% url 'editar_perfil' %}" class="w-full bg-green-500 text-white py-2 rounded block text-center hover:bg-green-600">
                Editar Perfil
            </a>
            <a href="{% url 'logout' %}" class="w-full bg-red-500 text-white py-2 rounded block text-center hover:bg-red-600">
                Cerrar Sesión
            </a>
        </div>
    </div>
</body>
</html>
