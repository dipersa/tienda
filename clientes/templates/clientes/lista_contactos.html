<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Contactos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-5 py-10">
        <h2 class="text-3xl font-bold text-blue-500 text-center mb-6">Mis Contactos</h2>

        <div class="mb-4 text-right">
            <a href="{% url 'agregar_contacto' %}" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Agregar Contacto</a>
        </div>

        <ul class="bg-white shadow-md rounded-lg divide-y divide-gray-200">
            {% for contacto in contactos %}
            <li class="p-4 flex justify-between items-center">
                <div>
                    <p class="text-lg font-bold">{{ contacto.nombre }} {{ contacto.apellidos }}</p>
                    <p class="text-gray-600">Celular: {{ contacto.celular }}</p>
                </div>
                <div class="space-x-2">
                    <a href="{% url 'editar_contacto' contacto.id %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Editar</a>
                    <a href="{% url 'eliminar_contacto' contacto.id %}" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Eliminar</a>
                </div>
            </li>
            {% endfor %}
        </ul>

        <div class="mt-6 text-center">
            <a href="{% url 'dashboard' %}" class="text-blue-500 hover:underline">Volver al Dashboard</a>
        </div>
    </div>
</body>
</html>
