{% extends 'productos/base.html' %}
{% block title %}Contraseña Restablecida{% endblock %}

{% block content %}
<section class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <div class="card-header bg-success text-white text-center">
            <h5 class="mb-0">¡Contraseña Restablecida!</h5>
        </div>
        <div class="card-body text-center">
            <p class="text-muted mb-4">
                Tu contraseña ha sido restablecida exitosamente. Ahora puedes iniciar sesión con tu nueva contraseña.
            </p>
            <a href="{% url 'login' %}" class="btn btn-success w-100">
                <i class="fas fa-sign-in-alt"></i> Ir al Login
            </a>
        </div>
    </div>
</section>
{% endblock %}
