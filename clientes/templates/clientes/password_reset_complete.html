{% extends 'productos/base.html' %}
{% block title %}Contraseña Restablecida{% endblock %}

{% block content %}
<section class="container mx-auto px-5 py-10 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
        <h2 class="text-2xl font-bold text-center text-blue-500 mb-6">¡Contraseña Restablecida!</h2>
        <p class="text-sm text-gray-600 text-center mb-4">
            Tu contraseña ha sido restablecida exitosamente. Ahora puedes iniciar sesión con tu nueva contraseña.
        </p>

        <div class="mt-6 text-center">
            <a href="{% url 'login' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
                Ir al Login
            </a>
        </div>
    </div>
</section>
{% endblock %}
