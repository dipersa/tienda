{% block title %}Confirmación de Pago{% endblock %}

        <h2 class="text-success mb-4">¡Pago Enviado Correctamente!</h2>
        <p class="fs-5 text-muted">
            Tu comprobante de pago ha sido enviado exitosamente. El administrador revisará tu pedido y se comunicará contigo en breve.

        <div class="mt-4">
            <a href="{% url 'tienda' %}" class="btn btn-primary">
                <i class="fas fa-home"></i> Volver a la Tienda

    </div>
</div>
{% endblock %}
